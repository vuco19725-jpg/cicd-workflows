name: One-Click Project Setup
on:
  workflow_dispatch:
    inputs:
      owner:
        required: false
        type: string
        default: "vuco19725-jpg"
        description: "GitHub 用户名或组织名"
      repo:
        required: true
        type: string
        description: "目标仓库名 (如 my-project)"
      language:
        required: true
        type: choice
        options: [node, go, java, python, c]
        description: "主要编程语言"
      approver:
        required: false
        type: string
        default: "vuco19725-jpg"
        description: "CODEOWNERS 审批人"
      deploy:
        required: false
        type: boolean
        default: false
        description: "是否添加 CD 部署配置"
    secrets:
      SETUP_TOKEN:
        required: true
        description: "有 repo 权限的 PAT"

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ inputs.owner }}
      REPO: ${{ inputs.owner }}/${{ inputs.repo }}
      LANG: ${{ inputs.language }}
      APPROVER: ${{ inputs.approver }}
    steps:
      - name: Create all project files
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          echo "🚀 Setting up $REPO (language: $LANG)"

          # ── 1. ci.yml ──
          cat > /tmp/ci.yml << 'CIEOF'
          name: CI
          on:
            pull_request:
              branches: [main]

          permissions:
            contents: read
            pull-requests: write

          jobs:
            pr-check:
              uses: __OWNER__/cicd-workflows/.github/workflows/pr-check.yml@main
              with:
                language: __LANG__
              secrets:
                DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                BOT_PAT: ${{ secrets.BOT_PAT }}
          CIEOF
          sed -i "s/__OWNER__/$OWNER/g; s/__LANG__/$LANG/g" /tmp/ci.yml
          gh api repos/$REPO/contents/.github/workflows/ci.yml \
            -f message="Setup: CI workflow" -f content="$(base64 -w0 < /tmp/ci.yml)" --silent 2>/dev/null \
            && echo "✅ ci.yml" || echo "⚠️ ci.yml skipped"

          # ── 2. auto-pr.yml ──
          cat > /tmp/auto-pr.yml << 'APREOF'
          name: Auto Create PR
          on:
            push:
              branches-ignore:
                - main

          permissions:
            contents: read
            pull-requests: write

          jobs:
            create-pr:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Create Pull Request
                  uses: repo-sync/pull-request@v2
                  with:
                    destination_branch: main
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    pr_title: "${{ github.event.head_commit.message }}"
                    pr_body: |
                      🤖 自动创建 - CI 和 AI 审查进行中
                    pr_draft: false
          APREOF
          gh api repos/$REPO/contents/.github/workflows/auto-pr.yml \
            -f message="Setup: Auto PR workflow" -f content="$(base64 -w0 < /tmp/auto-pr.yml)" --silent 2>/dev/null \
            && echo "✅ auto-pr.yml" || echo "⚠️ auto-pr.yml skipped"

          # ── 3. branch-cleanup.yml ──
          cat > /tmp/branch-cleanup.yml << 'BCEOF'
          name: Branch Cleanup
          on:
            pull_request:
              types: [closed]
          permissions:
            contents: write
          jobs:
            cleanup:
              if: github.event.pull_request.merged == true
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    token: ${{ secrets.BOT_PAT }}
                - name: Delete merged branch
                  env:
                    BRANCH: ${{ github.event.pull_request.head.ref }}
                  run: |
                    case "$BRANCH" in
                      main|master|develop|staging|release/*)
                        echo "Protected branch, skip: $BRANCH"
                        exit 0 ;;
                    esac
                    echo "Deleting remote branch: $BRANCH"
                    git push origin --delete "$BRANCH"
          BCEOF
          gh api repos/$REPO/contents/.github/workflows/branch-cleanup.yml \
            -f message="Setup: Branch cleanup" -f content="$(base64 -w0 < /tmp/branch-cleanup.yml)" --silent 2>/dev/null \
            && echo "✅ branch-cleanup.yml" || echo "⚠️ branch-cleanup.yml skipped"

          # ── 4. Dependabot ──
          echo 'version: 2' > /tmp/dep.yml
          echo 'updates:' >> /tmp/dep.yml
          case $LANG in
            node)   echo "  - package-ecosystem: npm" >> /tmp/dep.yml; echo "    directory: /" >> /tmp/dep.yml; echo "    schedule: { interval: weekly }" >> /tmp/dep.yml; echo "    groups: { deps: { patterns: [\"*\"], update-types: [minor, patch] } }" >> /tmp/dep.yml ;;
            go)     echo "  - package-ecosystem: gomod" >> /tmp/dep.yml; echo "    directory: /" >> /tmp/dep.yml; echo "    schedule: { interval: weekly }" >> /tmp/dep.yml ;;
            java)   echo "  - package-ecosystem: maven" >> /tmp/dep.yml; echo "    directory: /" >> /tmp/dep.yml; echo "    schedule: { interval: weekly }" >> /tmp/dep.yml ;;
            python) echo "  - package-ecosystem: pip" >> /tmp/dep.yml; echo "    directory: /" >> /tmp/dep.yml; echo "    schedule: { interval: weekly }" >> /tmp/dep.yml ;;
          esac
          echo "  - package-ecosystem: github-actions" >> /tmp/dep.yml; echo "    directory: /" >> /tmp/dep.yml; echo "    schedule: { interval: weekly }" >> /tmp/dep.yml
          gh api repos/$REPO/contents/.github/dependabot.yml \
            -f message="Setup: Dependabot" -f content="$(base64 -w0 < /tmp/dep.yml)" --silent 2>/dev/null \
            && echo "✅ dependabot.yml" || echo "⚠️ dependabot.yml skipped"

          # ── 5. CODEOWNERS ──
          echo "config/** @$APPROVER" > /tmp/co
          echo "**/Dockerfile @$APPROVER" >> /tmp/co
          echo "**/*.yml @$APPROVER" >> /tmp/co
          gh api repos/$REPO/contents/.github/CODEOWNERS \
            -f message="Setup: CODEOWNERS" -f content="$(base64 -w0 < /tmp/co)" --silent 2>/dev/null \
            && echo "✅ CODEOWNERS" || echo "⚠️ CODEOWNERS skipped"

          echo ""
          echo "=== Done: $REPO ==="
          echo "Next: Add DEEPSEEK_API_KEY + BOT_PAT in repo Settings → Secrets"

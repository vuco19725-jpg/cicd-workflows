name: Project Setup
on:
  workflow_dispatch:
    inputs:
      repo:
        required: true
        type: string
        description: "Target repository name (e.g., cicd-)"
      languages:
        required: true
        type: string
        description: "Languages: node,go,java,python,c"
    secrets:
      SETUP_TOKEN:
        required: true
        description: "PAT with repo scope"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and deploy configs
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
          REPO: vuco19725-jpg/${{ inputs.repo }}
          LANGS: ${{ inputs.languages }}
        run: |
          # Dependabot config
          echo 'version: 2' > /tmp/dependabot.yml
          echo 'updates:' >> /tmp/dependabot.yml
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            case $lang in
              node)   echo "  - package-ecosystem: npm" >> /tmp/dependabot.yml
                      echo "    directory: /" >> /tmp/dependabot.yml
                      echo "    schedule: { interval: weekly }" >> /tmp/dependabot.yml
                      echo "    groups: { deps: { patterns: [\"*\"], update-types: [minor, patch] } }" >> /tmp/dependabot.yml ;;
              go)     echo "  - package-ecosystem: gomod" >> /tmp/dependabot.yml
                      echo "    directory: /" >> /tmp/dependabot.yml
                      echo "    schedule: { interval: weekly }" >> /tmp/dependabot.yml ;;
              java)   echo "  - package-ecosystem: maven" >> /tmp/dependabot.yml
                      echo "    directory: /" >> /tmp/dependabot.yml
                      echo "    schedule: { interval: weekly }" >> /tmp/dependabot.yml ;;
              python) echo "  - package-ecosystem: pip" >> /tmp/dependabot.yml
                      echo "    directory: /" >> /tmp/dependabot.yml
                      echo "    schedule: { interval: weekly }" >> /tmp/dependabot.yml ;;
            esac
          done
          echo "  - package-ecosystem: github-actions" >> /tmp/dependabot.yml
          echo "    directory: /" >> /tmp/dependabot.yml
          echo "    schedule: { interval: weekly }" >> /tmp/dependabot.yml

          echo "=== Setting up $REPO ==="

          # Create dependabot.yml
          DEP_B64=$(base64 -w0 < /tmp/dependabot.yml)
          gh api repos/$REPO/contents/.github/dependabot.yml \
            -f message="Setup Dependabot" -f content="$DEP_B64" --silent 2>/dev/null \
            && echo "✅ dependabot.yml" || echo "⚠️ dependabot.yml skipped"

          # Create CODEOWNERS
          echo 'config/** @vuco19725-jpg
**/Dockerfile @vuco19725-jpg
**/*.yml @vuco19725-jpg' | base64 -w0 > /tmp/co.b64
          gh api repos/$REPO/contents/.github/CODEOWNERS \
            -f message="Setup CODEOWNERS" -f content="$(cat /tmp/co.b64)" --silent 2>/dev/null \
            && echo "✅ CODEOWNERS" || echo "⚠️ CODEOWNERS skipped"

          echo "=== Done: $REPO ==="

name: Reusable PR Check

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: "go | node"
      lint-command:
        required: false
        type: string
        description: "Override default lint command"
      build-command:
        required: false
        type: string
        description: "Override default build command"
      test-command:
        required: false
        type: string
        description: "Override default test command"
      enable-config-check:
        required: false
        type: boolean
        default: false
        description: "Enable YAML config validation + placeholder check"
      enable-codeql:
        required: false
        type: boolean
        default: false
        description: "Enable CodeQL code-level security analysis"
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      BOT_PAT:
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 配置有效性检查 ──
  config-check:
    if: ${{ inputs.enable-config-check }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check placeholder values
        run: |
          PLACEHOLDERS=$(find . \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) \
            ! -path "./node_modules/*" ! -path "./vendor/*" \
            -exec grep -l "REPLACE_ME\|TODO_SECRET\|CHANGEME\|<INSERT>" {} + 2>/dev/null || true)
          if [ -n "$PLACEHOLDERS" ]; then
            echo "::error::配置文件中有未替换的占位符: $PLACEHOLDERS"
            exit 1
          fi
          echo "Config validation passed"

  # ── 代码级安全分析（CodeQL）──
  codeql:
    if: ${{ inputs.enable-codeql }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.language == 'go' && 'go' || 'javascript-typescript' }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}
      - if: ${{ inputs.lint-command == '' && inputs.language == 'go' }}
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - if: ${{ inputs.lint-command == '' && inputs.language == 'node' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - if: ${{ inputs.lint-command == '' && inputs.language == 'node' }}
        run: npm install && npm run lint
        working-directory: web

  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
      - if: ${{ inputs.build-command == '' && inputs.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - if: ${{ inputs.build-command == '' && inputs.language == 'go' }}
        run: go build ./...
      - if: ${{ inputs.build-command == '' && inputs.language == 'node' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - if: ${{ inputs.build-command == '' && inputs.language == 'node' }}
        run: npm install && npm run build
        working-directory: web

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}
      - if: ${{ inputs.test-command == '' && inputs.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - if: ${{ inputs.test-command == '' && inputs.language == 'go' }}
        run: go test ./...
      - if: ${{ inputs.test-command == '' && inputs.language == 'node' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - if: ${{ inputs.test-command == '' && inputs.language == 'node' }}
        run: npm install && npm test
        working-directory: web

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event.pull_request && github.actor != 'dependabot[bot]'
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: vuco19725-jpg/cicd-workflows
          path: _shared

      - name: Generate diff
        run: |
          git diff origin/main...HEAD > /tmp/pr.diff
          echo "Diff: $(wc -c < /tmp/pr.diff) bytes, $(wc -l < /tmp/pr.diff) lines"

      - name: AI Code Review
        if: env.DEEPSEEK_API_KEY != ''
        run: |
          cp _shared/scripts/ai-review.sh /tmp/ai-review.sh
          cp _shared/.github/ai-review-rules.md /tmp/ai-review-rules.md
          bash /tmp/ai-review.sh "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}

      - name: Skip AI review
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "AI review skipped - DEEPSEEK_API_KEY secret not configured"

  auto-merge:
    needs: [config-check, codeql, lint, build-check, unit-test, secret-scan, security-scan, ai-review]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Auto-merge
        run: |
          RESP=$(curl -s -X PUT \
            -H "Authorization: token $BOT_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge" \
            -d '{"merge_method":"squash"}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"merged":true'; then
            echo "Merged successfully"
          else
            echo "Merge failed, enabling auto-merge fallback"
            gh pr merge --auto --squash "${{ github.event.pull_request.number }}" || true
          fi
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          GH_TOKEN: ${{ secrets.BOT_PAT }}
